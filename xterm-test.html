<!DOCTYPE html>
<html>
<head>
  <title>xterm.js 数据诊断</title>
  <meta charset="UTF-8" />
</head>
<body style="margin:0; background:#1e1e1e;">
  <div id="terminal"></div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script>
    var term = new Terminal({
      theme: { background: '#1e1e1e', foreground: '#ffffff' },
      cols: 80, rows: 24
    });

    term.open(document.getElementById('terminal'));

    // === 写入前：dump buffer 结构 ===
    console.log('=== 写入前 ===');
    var buf = term.buffer.active;
    console.log('buffer keys:', Object.keys(buf));
    console.log('buffer:', JSON.stringify(buf).substring(0, 500));

    // 尝试各种可能的属性名
    var props = ['y', 'x', 'ybase', 'ydisp', 'cursorY', 'cursorX', 'viewportY', 'baseY',
                 '_y', '_x', '_ybase', '_ydisp'];
    for (var p of props) {
      console.log('buf.' + p + ':', buf[p]);
    }

    // 尝试 getLine
    for (var i = 0; i < 3; i++) {
      var line = buf.getLine(i);
      if (line) {
        console.log('line ' + i + ':', line.translateToString ? line.translateToString(true) : String(line));
        console.log('line ' + i + ' keys:', Object.keys(line));
      }
    }

    // 写入
    term.write('Test A\r\n');

    setTimeout(function() {
      console.log('=== write 后 500ms ===');
      var b = term.buffer.active;
      for (var i = 0; i < 3; i++) {
        var l = b.getLine(i);
        if (l) console.log('line' + i + ':', l.translateToString(true));
      }
    }, 500);
  </script>
</body>
</html>
