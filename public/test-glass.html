<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .test-glass {
      width: 300px;
      height: 200px;
      backdrop-filter: blur(30px) saturate(1.2);
      background: rgba(245, 240, 230, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="test-glass">
    毛玻璃测试
  </div>
</body>
</html>
