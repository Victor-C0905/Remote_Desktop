# GNOME Remote Agent 配置
# Token 已自动生成，请妥善保管

[server]
bind = "0.0.0.0"
quic_port = 8443
ws_port = 8444
cert_path = "./cert.pem"
key_path = "./key.pem"

[auth]
token = "gmr_1ecb954c-9a8c-4a5e-a3b4-f9a77af0d036"

[security]
# allowed_paths 为空表示不限制，完全依赖 Linux 文件系统权限
# 如果需要限制，可以添加路径白名单，例如：
# allowed_paths = ["/home", "/var/log"]
allowed_paths = []
blocked_commands = [
    "rm -rf /",
    "dd if=",
    "mkfs.",
    ":(){ :|:& };:",
    "shutdown",
    "reboot",
]

[limits]
max_terminal_sessions = 10
max_file_transfer_mb = 500
metrics_interval_secs = 2

[collectors]
# 系统监控采集间隔（秒）
metrics_interval_secs = 1
# 文件变化监听延迟（毫秒，避免频繁触发）
file_changes_delay_ms = 100
# 进程扫描间隔（秒）
process_scan_interval_secs = 2
# 服务状态检查间隔（秒）
service_status_interval_secs = 5
