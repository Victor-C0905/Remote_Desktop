syntax = "proto3";

package agent;

// Agent IPC 协议定义

// ===== 基础消息类型 =====

// 管理器请求
message ManagerRequest {
    uint64 request_id = 1;
    oneof payload {
        CreateSession create_session = 2;
        ResizeWindow resize_window = 3;
        KillSession kill_session = 4;
        ReadDir read_dir = 5;
        ReadFile read_file = 6;
        WriteFile write_file = 7;
        ExecuteCommand execute_command = 8;
        GetSystemInfo get_system_info = 9;
    }
}

// Worker 响应
message WorkerResponse {
    uint64 request_id = 1;
    oneof payload {
        SessionCreated session_created = 2;
        DirListing dir_listing = 3;
        FileContent file_content = 4;
        WriteResult write_result = 5;
        CommandOutput command_output = 6;
        SystemInfo system_info = 7;
        Error error = 8;
    }
}

// 错误响应
message Error {
    uint32 code = 1;
    string message = 2;
}

// ===== 会话管理 =====

message CreateSession {
    uint32 cols = 1;
    uint32 rows = 2;
    string shell = 3;
    string working_directory = 4;
}

message SessionCreated {
    string session_id = 1;
}

message ResizeWindow {
    string session_id = 1;
    uint32 cols = 2;
    uint32 rows = 3;
}

message KillSession {
    string session_id = 1;
}

// ===== 文件操作 =====

message ReadDir {
    string path = 1;
}

message DirListing {
    string path = 1;
    repeated FileEntry entries = 2;
}

message FileEntry {
    string name = 1;
    bool is_dir = 2;
    uint64 size = 3;
    string mtime = 4;
    string permissions = 5;
}

message ReadFile {
    string path = 1;
}

message FileContent {
    string path = 1;
    bytes content = 2;
    uint64 mtime = 3;
    uint64 size = 4;
}

message WriteFile {
    string path = 1;
    bytes content = 2;
}

message WriteResult {
    string path = 1;
    uint64 mtime = 2;
    uint64 size = 3;
}

// ===== 命令执行 =====

message ExecuteCommand {
    string command = 1;
    repeated string args = 2;
    string working_directory = 3;
}

message CommandOutput {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
}

// ===== 系统信息 =====

message GetSystemInfo {}

message SystemInfo {
    string hostname = 1;
    string os_name = 2;
    string os_version = 3;
    string kernel_version = 4;
    uint64 uptime_secs = 5;
    CpuInfo cpu = 6;
    MemoryInfo memory = 7;
    repeated DiskInfo disks = 8;
}

message CpuInfo {
    string model = 1;
    uint32 cores = 2;
    double usage_percent = 3;
}

message MemoryInfo {
    uint64 total_bytes = 1;
    uint64 used_bytes = 2;
    uint64 available_bytes = 3;
    double usage_percent = 4;
}

message DiskInfo {
    string mount_point = 1;
    string device = 2;
    string filesystem = 3;
    uint64 total_bytes = 4;
    uint64 used_bytes = 5;
    uint64 available_bytes = 6;
    double usage_percent = 7;
}