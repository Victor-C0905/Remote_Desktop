[package]
name = "gnome-remote-agent"
version = "0.1.0"
edition = "2021"
description = "GNOME Remote Control — 远程 Agent 服务端"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# QUIC 协议栈
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.12"
rustls-pemfile = "2"

# WebSocket 备选协议
tokio-tungstenite = "0.21"
futures-util = "0.3"
tokio-rustls = "0.26"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
bytes = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# 配置热重载
notify = "6"

# 系统信息（后续监控功能用）
sysinfo = "0.32"

# 用户信息
whoami = "1.4"

# 时间格式化
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
