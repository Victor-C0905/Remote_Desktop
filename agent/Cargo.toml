[package]
name = "gnome-remote-agent"
version = "0.1.0"
edition = "2021"
description = "GNOME Remote Control — 远程 Agent 服务端"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
# 异步运行时（精确特性，避免拉入 fs/process/signal 等不需要的模块）
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

# QUIC 协议栈（禁用 platform-verifier，项目使用自签证书）
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rcgen = "0.12"
rustls-pemfile = "2"

# WebSocket 备选协议
tokio-tungstenite = "0.21"
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# 工具
bytes = "1"
uuid = { version = "1", features = ["v4"] }
lazy_static = "1.4"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# 配置热重载（禁用 macOS 特性）
notify = { version = "6", default-features = false, features = ["crossbeam-channel"] }

# 系统信息（仅启用实际使用的采集器）
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }

# 用户信息
whoami = "1.4"

# 时间格式化
chrono = "0.4"

# SSH协议栈（后续迭代使用）
# russh = "0.42"  # TODO: 签名验证时启用
# russh-keys = "0.42"  # TODO: 签名验证时启用
base64 = "0.22"

# Unix-only 依赖（仅在 Linux/macOS 上编译）
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "process", "ioctl", "fs", "sched", "user"] }
libc = "0.2"
pam = "0.8"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
