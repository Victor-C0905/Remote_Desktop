[package]
name = "quirel"
version = "0.3.3"
description = "Quirel — 远程 Linux 服务器控制客户端"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quirel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 服务器凭据的 OS 级存储（Windows Credential Manager 等），替代明文 JSON
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# 凭据信封加密（AES-GCM）；与 rustls/quinn 的传递依赖同版本，无双编译
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# GBK/GB18030 文本解码回退（中文服务器常见编码）
encoding_rs = "0.8"

# 线上协议单一真相源（与 agent 共享）
quirel-protocol = { path = "../quirel-protocol" }

# 远程连接
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
# TCP 监听设置 SO_REUSEADDR（与 agent 端惯例一致，允许残留 Socket 时立即重绑端口）
socket2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
tokio-rustls = "0.26"
# suggest 联想词 TLS 根证书来源。注意：该 crate 已在依赖树内编译（quinn
# platform-verifier → rustls-platform-verifier 传递引入），提为直接依赖
# 不新增任何编译产物；替代方案（windows crate 枚举证书库）是重复造轮子
rustls-native-certs = "0.8"
tauri-plugin-store = "2.4.3"
once_cell = "1.19"
ctrlc = "3.4"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption"] }
signature = "2.2"

# PEM 格式私钥支持（包括加密私钥）
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pem = "3.0"
sha2 = "0.10"

# SSH 自动安装通道（quireld 自动供应）：russh 自带加密栈不依赖 rustls，
# 仅共享 tokio/rand/ed25519-dalek，避免与 quinn 的 rustls 0.23(ring) 冲突
russh = "0.49"
russh-sftp = "2"
# russh Handler trait 基于 async-trait 宏（impl 侧需同宏标注）
async-trait = "0.1"
thiserror = "2"
# GitHub Releases 下载（quireld 二进制/SHA256SUMS）：rustls-tls 默认走 ring provider
# 与 quinn 共用 ring 编译单元，禁用 default-features 防止 native-tls/openssl-sys 混入
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 安装包解压（本地 tarball 校验解压）
tar = "0.4"
flate2 = "1.0"
# sudo 密码缓冲用后即清（自动供应链路密钥材料不落盘不留痕）
zeroize = "1"

# 内置浏览器：WebView2 独立 Environment（嵌入 Quirel 桌面）
# 版本锁定说明：wry 0.55.1 引入 webview2-com 0.38，必须复用同版本，
# 版本错位会导致 windows crate 双份编译（二进制 +5~15MB）
[target.'cfg(windows)'.dependencies]
# 与 tauri 2.12 / wry 的 webview2-com 0.39 保持同版本（错位会双份编译 windows crate）
webview2-com = "0.39"
# features 显式声明本项目直接用到的 Win32 面（其余由依赖图聚合提供）：
# Gdi=CreateRoundRectRgn、HiDpi=GetDpiForWindow（webview 圆角 region）、
# Threading=CreateEventW/SetEvent（主循环唤醒事件）、Security=CreateEventW 的
# SECURITY_ATTRIBUTES 参数类型（MsgWait 系列在 WindowsAndMessaging，依赖图已含）
# 版本与 tauri 2.12 的传递依赖对齐（0.62），错位会双份编译（二进制 +5~15MB）
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console", "Win32_Foundation", "Win32_Security"] }

[profile.dev]
# 行表级调试信息：回溯含行号，调试信息体积较完整 DWARF 大幅缩小（PDB/增量缓存）
debug = "line-tables-only"

[profile.release]
opt-level = 3          # 最高优化等级
lto = true             # 链接时优化(减少体积)
strip = true           # 移除调试符号
codegen-units = 1      # 单代码单元(优化更好)
panic = "abort"        # 减少panic处理代码

