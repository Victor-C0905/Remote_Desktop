[package]
name = "quirel"
version = "0.1.2"
description = "Quirel — 远程 Linux 服务器控制客户端"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quirel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# 线上协议单一真相源（与 agent 共享）
quirel-protocol = { path = "../quirel-protocol" }

# 远程连接
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
# TCP 监听设置 SO_REUSEADDR（与 agent 端惯例一致，允许残留 Socket 时立即重绑端口）
socket2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
tokio-rustls = "0.26"
tauri-plugin-store = "2.4.3"
once_cell = "1.19"
ctrlc = "3.4"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption"] }
signature = "2.2"

# PEM 格式私钥支持（包括加密私钥）
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pem = "3.0"
sha2 = "0.10"

[profile.release]
opt-level = 3          # 最高优化等级
lto = true             # 链接时优化(减少体积)
strip = true           # 移除调试符号
codegen-units = 1      # 单代码单元(优化更好)
panic = "abort"        # 减少panic处理代码

